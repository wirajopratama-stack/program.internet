<!DOCTYPE html>
<html lang="en">

<body>

<form action="proses.html" method="post">

    <label for="nama">Nama</label>
    <input type="text" name="nama" id="nama" value="Budi"><br>

    <label for="tmpt_lahir">Tempat Lahir</label>
    <input type="text" name="tmpt_lahir" id="tmpt_lahir"
    value="Dharmasraya"><br>

    <label for="tgl_lahir">Tanggal Lahir</label>
    <input type="date" name="tgl_lahir"
    id="tgl_lahir"
    value="2005-11-10"><br>

    <p>Hobi (bisa lebih dari 1 pilihan)</p>

    <label for="berenang">berenang</label>
    <input type="checkbox" name="hobi[]" checked
    id="berenang" value="berenang">

    <label for="membaca">membaca</label>
    <input type="checkbox" name="hobi[]" checked
    id="membaca" value="membaca">

    <label for="melukis">melukis</label>
    <input type="checkbox" name="hobi[]" id="melukis"
    value="melukis"><br>

    <p>Jenis kelamin</p>

    <label for="l">Laki-laki</label>
    <input type="radio" name="jk" id="l" value="L">

    <label for="p">Perempuan</label>
    <input type="radio" name="jk" id="p" checked value="P">

    <input type="submit" value="simpan">

</form>

</body>
</html>
