<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata</title>
</head>

<body>

<form action="proses.html" method="post">

    <label for="nama">Nama</label>
    <input type="text" name="nama" id="nama" value="Budi">

    <label for="tempat_lahir">Tempat Lahir</label>
    <input type="text" name="tempat_lahir" id="tempat_lahir">

    <label for="tgl_lahir">Tanggal Lahir</label>
    <input type="date" name="tgl_lahir" id="tgl_lahir">

    <p>Hobi (bisa lebih dari 1 pilihan)</p>

    <label for="berenang">Berenang</label>
    <input type="checkbox" name="hobi[]" id="berenang" value="berenang">

    <label for="membaca">Membaca</label>
    <input type="checkbox" name="hobi[]" id="membaca" value="membaca">

    <label for="melukis">Melukis</label>
    <input type="checkbox" name="hobi[]" id="melukis" value="melukis">

    <p>Jenis Kelamin</p>

    <label for="L">Laki-laki</label>
    <input type="radio" name="jk" id="L" value="L">

    <label for="P">Perempuan</label>
    <input type="radio" name="jk" id="P" value="P">

    <br><br>

    <input type="submit" value="Simpan">

</form>

</body>
</html>
